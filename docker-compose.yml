# Продакшн на одном сервере (Contabo VPS). Запуск: docker compose up -d --build
# Фиксированное имя проекта: свои контейнеры, сеть и тома homecare_*, не пересекаются с соседями по серверу
name: homecare

# Логи Docker без ротации растут бесконечно: ограничиваем 5 файлами по 10 МБ на сервис
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    mem_limit: 1g
    environment:
      POSTGRES_DB: homeservices
      POSTGRES_USER: app
      # Меняется только вместе с ALTER USER в базе: пароль применяется лишь при первом создании тома
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d homeservices"]
      interval: 5s
      retries: 20

  # Миграции и стартовые данные — выполняется при каждом деплое и завершается
  migrate:
    build: { context: ., target: builder }
    <<: *logging
    mem_limit: 1g
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/homeservices
      ADMIN_PHONE: ${ADMIN_PHONE:?set ADMIN_PHONE in .env}
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    <<: *logging
    mem_limit: 1g
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/homeservices
      APP_URL: ${APP_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Шифрование ключей интеграций в базе. Потеря ключа = ключи WhatsApp/SMS/Telegram придётся ввести заново
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # Ключ для API задач Control Center (агенты). Пусто — API выключено
      CC_AGENT_KEY: ${CC_AGENT_KEY:-}
      # Показывается в Control Center: открыт ли сайт поисковикам
      ROBOTS_TAG: ${ROBOTS_TAG:-noindex, nofollow}
      # Контакты бизнеса (единое место — блок CONTACT_* в .env)
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      CONTACT_WHATSAPP: ${CONTACT_WHATSAPP:-}
      CONTACT_TELEGRAM: ${CONTACT_TELEGRAM:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_INSTAGRAM: ${CONTACT_INSTAGRAM:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *logging
    mem_limit: 256m
    # Порты хоста задаются в .env (HTTP_BIND / HTTPS_BIND). По умолчанию 80 и 443.
    # На общем сервере, где 80/443 заняты nginx: HTTP_BIND=8080, HTTPS_BIND=127.0.0.1:8443
    ports: ["${HTTP_BIND:-80}:80", "${HTTPS_BIND:-443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # До запуска закрываем сайт от поисковиков; при запуске: ROBOTS_TAG=all
      ROBOTS_TAG: ${ROBOTS_TAG:-noindex, nofollow}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    <<: *logging
    mem_limit: 64m
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./deploy/cron.sh:/cron.sh:ro
    entrypoint: ["sh", "/cron.sh"]
    depends_on: [app]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    mem_limit: 512m
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Время ночного бэкапа, UTC (23:30 UTC = 03:30 по Еревану)
      BACKUP_AT: ${BACKUP_AT:-23:30}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
      - uploads:/uploads:ro
    entrypoint: ["sh", "/backup.sh"]
    # Ждём миграции: иначе первый бэкап снимается с ещё пустой базы
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
