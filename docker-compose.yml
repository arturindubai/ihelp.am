# Продакшн на одном сервере (Contabo VPS). Запуск: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeservices
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d homeservices"]
      interval: 5s
      retries: 20

  # Миграции и стартовые данные — выполняется при каждом деплое и завершается
  migrate:
    build: { context: ., target: builder }
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/homeservices
      ADMIN_PHONE: ${ADMIN_PHONE:?set ADMIN_PHONE in .env}
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/homeservices
      APP_URL: ${APP_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["sh", "-c", "while true; do curl -fsS -H \"x-cron-secret: $$CRON_SECRET\" http://app:3000/api/cron; echo; sleep 900; done"]
    depends_on: [app]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U app homeservices | gzip > /backups/db-$$(date +%F).sql.gz; find /backups -name 'db-*.sql.gz' -mtime +14 -delete; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
