# Эталонный конфиг nginx vhost для ihelp.am.
# Физический файл: /etc/nginx/sites-available/ihelp.am.conf
# Симлинк: /etc/nginx/sites-enabled/ihelp.am.conf
#
# Порядок правки (CLAUDE.md «Границы проекта»):
#   cp -a /etc/nginx /etc/nginx.bak-$(date +%Y%m%d-%H%M)
#   nginx -t && nginx -s reload
#   deploy/smoke.sh
#
# proxy_set_header X-Forwarded-For $remote_addr — ПЕРЕЗАПИСЫВАЕТ заголовок адресом прямого клиента nginx
# (т.е. реальным IP посетителя, т.к. nginx принимает соединение напрямую).
# НЕ $proxy_add_x_forwarded_for — тот добавляет к цепочке и позволяет клиенту подставить чужой IP.
# Caddy внутри Docker уже настроен принимать X-Forwarded-For от приватных адресов (trusted_proxies private_ranges).

server {
    listen 80;
    listen [::]:80;
    server_name ihelp.am www.ihelp.am;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ihelp.am www.ihelp.am;

    ssl_certificate     /etc/letsencrypt/live/ihelp.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ihelp.am/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        # Перезапись (не накопление): реальный IP клиента, клиент не может его подменить
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade   $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
