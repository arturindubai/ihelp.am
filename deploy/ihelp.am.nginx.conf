# Эталонный конфиг nginx vhost для ihelp.am.
# Физический файл: /etc/nginx/sites-available/ihelp.am.conf
# Симлинк: /etc/nginx/sites-enabled/ihelp.am.conf
#
# Порядок применения (CLAUDE.md «Границы проекта»):
#   cp -a /etc/nginx /etc/nginx.bak-$(date +%Y%m%d-%H%M)
#   cp /opt/ihelp.am/deploy/ihelp.am.nginx.conf /etc/nginx/sites-available/ihelp.am.conf
#   nginx -t && nginx -s reload
#   /opt/ihelp.am/deploy/smoke.sh
#
# После применения проверить вручную:
#   curl -sI https://ihelp.am/ru | grep -i strict-transport  # ожидается Strict-Transport-Security
#   curl -sI https://www.ihelp.am/ | grep -i location         # ожидается 301 → https://ihelp.am/
#   curl -s https://ihelp.am/ru | grep -o 'hreflang.*'       # все ссылки должны быть https://
#   # Загрузка картинки 8 МБ в /ru/admin → «Медиатека» через браузер — должна пройти
#
# proxy_set_header X-Forwarded-For $remote_addr — ПЕРЕЗАПИСЫВАЕТ (не накапливает):
# клиент не может подменить IP; Caddy внутри Docker настроен принимать этот заголовок
# от приватных адресов (trusted_proxies private_ranges в deploy/Caddyfile).

# HTTP → HTTPS redirect для apex и www
server {
    listen 80;
    listen [::]:80;
    server_name ihelp.am www.ihelp.am;
    server_tokens off;
    return 301 https://ihelp.am$request_uri;
}

# www → apex redirect по HTTPS (дубль для поисковиков)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ihelp.am;

    ssl_certificate     /etc/letsencrypt/live/ihelp.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ihelp.am/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    return 301 https://ihelp.am$request_uri;
}

# Основной HTTPS-сервер для ihelp.am
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ihelp.am;

    ssl_certificate     /etc/letsencrypt/live/ihelp.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ihelp.am/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Принимаем тела до 20 МБ: загрузка картинок в админке до 12 МБ + служебные байты multipart.
    # Без этого nginx отдаёт 413 на файлы >1 МБ, хотя Caddy и приложение принимают до 16 МБ.
    client_max_body_size 20M;

    # HSTS: браузер будет всегда ходить по HTTPS, даже если пользователь введёт http://.
    # includeSubDomains покрывает www.ihelp.am — www всё равно редиректится на apex.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        # Перезапись (не накопление): реальный IP клиента, клиент не может его подменить
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade   $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
