name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ migrate (builder — миграции и seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
          tags: |
            ghcr.io/arturindubai/ihelp.am/migrate:latest
            ghcr.io/arturindubai/ihelp.am/migrate:${{ github.sha }}

      - name: Образ app (runner — веб-сервер)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          tags: |
            ghcr.io/arturindubai/ihelp.am/app:latest
            ghcr.io/arturindubai/ihelp.am/app:${{ github.sha }}
